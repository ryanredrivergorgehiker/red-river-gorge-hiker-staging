name: Deploy Pinterest footer glyph V2 to staging main once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-pinterest-footer-glyph-v2-main-once.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build exact footer-glyph candidate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: 1c3973ab28cd57c4461fc7e9ec5ebbe6d739e878
          path: site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run full website checks
        working-directory: site
        run: npm run check

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Mark staging output noindex and verify candidate
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          for page in dist.rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  if '<head>' in text:
                      text = text.replace('<head>', f'<head>{robots_meta}', 1)
                  else:
                      text = robots_meta + text
                  page.write_text(text, encoding='utf-8')
          (dist / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')

          pages = list(dist.rglob('*.html'))
          if len(pages) != 44:
              raise RuntimeError(f'Expected 44 HTML pages, found {len(pages)}')
          home = (dist / 'index.html').read_text(encoding='utf-8')
          for marker in (
              'https://www.pinterest.com/redrivergorgehiker/',
              'aria-label="Red River Gorge Hiker on Pinterest"',
              'transform="translate(7.6 4.6) scale(0.04375)"',
              'M204 6.5c-102.6 0-204 68.4-204 179.1',
          ):
              if marker not in home:
                  raise RuntimeError(f'Missing candidate marker: {marker}')
          if 'M16 6.2c-5.4 0-8.2 3.9-8.2 7.1' in home:
              raise RuntimeError('Old Pinterest glyph remains in staging artifact')
          if any(robots_meta not in page.read_text(encoding='utf-8') for page in pages):
              raise RuntimeError('Staging noindex missing')
          if (dist / 'robots.txt').read_text(encoding='utf-8').splitlines() != ['User-agent: *', 'Disallow: /']:
              raise RuntimeError('Unexpected staging robots.txt')
          print('Verified exact glyph candidate, 44 pages, noindex, and robots Disallow all')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy and live-verify staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy staging Pages site
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify live staging footer glyph
        run: |
          python - <<'PY'
          import time, urllib.request
          url = 'https://ryanredrivergorgehiker.github.io/red-river-gorge-hiker-staging/?glyphv2=main'
          markers = [
              'https://www.pinterest.com/redrivergorgehiker/',
              'transform="translate(7.6 4.6) scale(0.04375)"',
              'M204 6.5c-102.6 0-204 68.4-204 179.1',
              'noindex,nofollow,noarchive',
          ]
          for attempt in range(24):
              try:
                  req = urllib.request.Request(url, headers={'Cache-Control':'no-cache','User-Agent':'RRGH-staging-verifier'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      html = response.read().decode('utf-8')
                  if all(marker in html for marker in markers):
                      print('Live staging verification passed')
                      raise SystemExit(0)
              except Exception as exc:
                  print(f'Attempt {attempt + 1}: {exc}')
              time.sleep(10)
          raise RuntimeError('Live staging did not serve Pinterest glyph V2 in time')
          PY

      - name: Record staging verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/report.json <<'JSON'
          {
            "status": "SUCCESS",
            "sourceCommit": "1c3973ab28cd57c4461fc7e9ec5ebbe6d739e878",
            "stagingUrl": "https://ryanredrivergorgehiker.github.io/red-river-gorge-hiker-staging/",
            "newGlyphPresent": true,
            "oldGlyphAbsent": true,
            "noindexVerified": true,
            "robotsDisallowAllVerified": true
          }
          JSON
          encoded="$(base64 -w0 /tmp/report.json)"
          gh api --method PUT repos/ryanredrivergorgehiker/red-river-gorge-hiker-staging/contents/STAGING-PINTEREST-FOOTER-GLYPH-V2-VERIFIED.json \
            -f message='Record Pinterest footer glyph V2 staging verification' \
            -f content="$encoded" \
            -f branch='main'
