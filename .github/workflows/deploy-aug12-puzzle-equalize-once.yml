name: Deploy Aug 12 equal puzzle image UAT once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-aug12-puzzle-equalize-once.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: 88564b1ed5e1c37eb68135e0102bdbd4f2ec905d
          path: site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run website checks
        working-directory: site
        run: npm run check

      - name: Verify equal puzzle image surface contract
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/pages/puzzles.astro').read_text()
          anchor = text.split('.puzzle-product-image {', 1)[1].split('}', 1)[0]
          image = text.split('.puzzle-product-image img {', 1)[1].split('}', 1)[0]
          for token in ('width: 100%;', 'aspect-ratio: 3 / 2;', 'overflow: hidden;'):
              if token not in anchor:
                  raise RuntimeError(f'Missing puzzle image-box rule: {token}')
          for token in ('width: 100%;', 'height: 100%;', 'object-fit: cover;'):
              if token not in image:
                  raise RuntimeError(f'Missing puzzle image fill rule: {token}')
          if 'height: auto;' in image:
              raise RuntimeError('Puzzle images still use intrinsic auto height')
          print('Equal puzzle image surface contract verified')
          PY

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Mark staging output noindex
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          changed = 0
          for page in dist.rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  text = text.replace('<head>', f'<head>{robots_meta}', 1) if '<head>' in text else robots_meta + text
                  page.write_text(text, encoding='utf-8')
                  changed += 1
          (dist / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          if changed == 0:
              raise RuntimeError('No HTML files received staging noindex')
          PY

      - name: Verify staging safeguards and puzzle route
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          if not (dist / 'puzzles' / 'index.html').exists():
              raise RuntimeError('Puzzle overview route missing')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          for page in dist.rglob('*.html'):
              if robots_meta not in page.read_text(encoding='utf-8'):
                  raise RuntimeError(f'Missing noindex in {page}')
          if (dist / 'robots.txt').read_text().splitlines() != ['User-agent: *', 'Disallow: /']:
              raise RuntimeError('Unexpected robots.txt')
          print('Staging safeguards and puzzle route verified')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5
