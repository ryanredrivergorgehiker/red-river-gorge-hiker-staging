name: Deploy standardized puzzle overview UAT once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-standardized-puzzle-overviews-once.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: 3e73df92ee5fcf5adf1e0e24948988cfa258031f
          path: site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run website checks
        working-directory: site
        run: npm run check

      - name: Verify standardized puzzle overview implementation
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('src/pages/puzzles.astro').read_text()
          expected = (
              'winter-at-red-byrd-arch-puzzle-overview.webp',
              'sunrise-at-eagles-nest-puzzle-overview.webp',
              'ice-at-west-of-copperas-pillar-puzzle-overview.webp',
          )
          for filename in expected:
              asset = Path('public/assets/puzzles/overview') / filename
              if not asset.exists() or asset.stat().st_size < 100000:
                  raise RuntimeError(f'Missing or undersized standardized puzzle overview: {filename}')
              if filename not in page:
                  raise RuntimeError(f'Puzzle overview page does not reference {filename}')
          for token in ('width: 1200', 'height: 900', 'aspect-ratio: 4 / 3;'):
              if token not in page:
                  raise RuntimeError(f'Missing standardized puzzle overview contract: {token}')
          for old in ('cardScale', '--puzzle-card-scale', 'transform: scale('):
              if old in page:
                  raise RuntimeError(f'Legacy puzzle scaling workaround still present: {old}')
          print('Standardized puzzle overview implementation verified')
          PY

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Mark staging output noindex
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          changed = 0
          for page in dist.rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  text = text.replace('<head>', f'<head>{robots_meta}', 1) if '<head>' in text else robots_meta + text
                  page.write_text(text, encoding='utf-8')
                  changed += 1
          (dist / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          if changed == 0:
              raise RuntimeError('No HTML files received staging noindex')
          PY

      - name: Verify staging safeguards and puzzle output
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          puzzle = dist / 'puzzles' / 'index.html'
          if not puzzle.exists():
              raise RuntimeError('Puzzle overview route missing')
          html = puzzle.read_text(encoding='utf-8')
          for filename in (
              'winter-at-red-byrd-arch-puzzle-overview.webp',
              'sunrise-at-eagles-nest-puzzle-overview.webp',
              'ice-at-west-of-copperas-pillar-puzzle-overview.webp',
          ):
              if filename not in html:
                  raise RuntimeError(f'Built puzzle page missing standardized overview {filename}')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          for page in dist.rglob('*.html'):
              if robots_meta not in page.read_text(encoding='utf-8'):
                  raise RuntimeError(f'Missing noindex in {page}')
          if (dist / 'robots.txt').read_text().splitlines() != ['User-agent: *', 'Disallow: /']:
              raise RuntimeError('Unexpected robots.txt')
          print('Staging safeguards and standardized puzzle output verified')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5
