name: Deploy Aug 14 Gear share nav refinements

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-aug14-share-gear-nav.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Aug 14 Gear share nav refinements
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: a8f15e52f3cb46c9acc41b467fc88c0c399b6938
          path: site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run website checks
        working-directory: site
        run: npm run check

      - name: Verify requested source refinements
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path

          gear = Path('src/pages/gear.astro').read_text(encoding='utf-8')
          share = Path('src/components/ShareControls.astro').read_text(encoding='utf-8')
          header = Path('src/components/Header.astro').read_text(encoding='utf-8')

          removed_intro = 'Red River Gorge Hiker logo gear inspired by Kentucky’s Red River Gorge and Clifty Wilderness.'
          body_start = gear.find('<div class="page merchandise-page">')
          if removed_intro in gear[body_start:]:
              raise RuntimeError('Removed Gear-page intro is still rendered in page body')

          ordering = gear.find('<section class="merch-ordering"')
          fulfillment = gear.find('<p class="merch-fulfillment">')
          pricing = gear.find('<div class="notice merch-pricing-notice"')
          if not (ordering >= 0 and fulfillment > ordering and pricing > fulfillment):
              raise RuntimeError('Gear fulfillment/pricing notices are not below Ordering in the requested sequence')

          share_tokens = [
              "const text = `${title} — Red River Gorge Hiker`;",
              'const basicShare = { title, text, url };',
              'findShareImage(controls)',
              'new File([blob]',
              'navigator.canShare({ files: [file] })',
              'await navigator.share({ ...basicShare, files: [imageFile] });',
              'await navigator.share(basicShare);',
          ]
          missing_share = [token for token in share_tokens if token not in share]
          if missing_share:
              raise RuntimeError('Share payload contract missing: ' + ', '.join(missing_share))

          nav_tokens = [
              '@media (max-width: 560px)',
              'grid-template-columns: repeat(6, minmax(0, 1fr));',
              '.site-header .mobile-primary-nav li:nth-child(1) { grid-column: 1 / span 2; }',
              '.site-header .mobile-primary-nav li:nth-child(2) { grid-column: 3 / span 2; }',
              '.site-header .mobile-primary-nav li:nth-child(3) { grid-column: 5 / span 2; }',
              '.site-header .mobile-primary-nav li:nth-child(4) { grid-column: 2 / span 2; }',
              '.site-header .mobile-primary-nav li:nth-child(5) { grid-column: 4 / span 2; }',
          ]
          missing_nav = [token for token in nav_tokens if token not in header]
          if missing_nav:
              raise RuntimeError('Portrait navigation contract missing: ' + ', '.join(missing_nav))

          print('Gear placement, enhanced sharing, and portrait navigation source checks passed')
          PY

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Mark staging output noindex
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path

          dist = Path('dist')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          changed = 0
          for page in dist.rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  if '<head>' in text:
                      text = text.replace('<head>', f'<head>{robots_meta}', 1)
                  else:
                      text = robots_meta + text
                  page.write_text(text, encoding='utf-8')
                  changed += 1
          (dist / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          if changed == 0:
              raise RuntimeError('No HTML files received staging noindex')
          print(f'Injected noindex into {changed} HTML files')
          PY

      - name: Verify staging safeguards
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          dist = Path('dist')
          base = '/red-river-gorge-hiker-staging/'
          expected_prefix = 'https://ryanredrivergorgehiker.github.io' + base
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'

          html_files = list(dist.rglob('*.html'))
          if not html_files:
              raise RuntimeError('No generated HTML files')
          for page in html_files:
              if robots_meta not in page.read_text(encoding='utf-8'):
                  raise RuntimeError(f'Missing noindex in {page}')

          if (dist / 'robots.txt').read_text(encoding='utf-8').splitlines() != ['User-agent: *', 'Disallow: /']:
              raise RuntimeError('Unexpected staging robots.txt')

          locs = []
          for sitemap in dist.glob('sitemap*.xml'):
              root = ET.parse(sitemap).getroot()
              for elem in root.iter():
                  if elem.tag.endswith('loc') and elem.text:
                      locs.append(elem.text.strip())
          if not locs or any(not loc.startswith(expected_prefix) for loc in locs):
              raise RuntimeError('Staging sitemap URL/base verification failed')

          print(f'Verified {len(html_files)} staging HTML files and safeguards')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy staging Pages site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5
