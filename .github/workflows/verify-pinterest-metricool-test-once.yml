name: Diagnose Pinterest Metricool test media once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-pinterest-metricool-test-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dedicated media verification branch
        uses: actions/checkout@v6
        with:
          ref: metricool-verified-media-20260818
          fetch-depth: 0

      - name: Download actual Metricool-hosted test media and record diagnostics
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p metricool-verification
          url1='https://static.metricool.com/planner/202608/6690085-file-1115928233969551926.jpeg'
          url2='https://static.metricool.com/planner/202608/6690085-file-13508756913751661061.png'
          status1=0
          status2=0
          curl --fail --location --retry 2 "$url1" --output /tmp/pinterest-test-1.jpeg || status1=$?
          curl --fail --location --retry 2 "$url2" --output /tmp/pinterest-test-2.png || status2=$?
          sha1='MISSING'
          sha2='MISSING'
          size1='MISSING'
          size2='MISSING'
          file1='MISSING'
          file2='MISSING'
          if [ -f /tmp/pinterest-test-1.jpeg ]; then
            sha1="$(sha256sum /tmp/pinterest-test-1.jpeg | awk '{print $1}')"
            size1="$(stat -c%s /tmp/pinterest-test-1.jpeg)"
            file1="$(file -b /tmp/pinterest-test-1.jpeg)"
          fi
          if [ -f /tmp/pinterest-test-2.png ]; then
            sha2="$(sha256sum /tmp/pinterest-test-2.png | awk '{print $1}')"
            size2="$(stat -c%s /tmp/pinterest-test-2.png)"
            file2="$(file -b /tmp/pinterest-test-2.png)"
          fi
          cat > metricool-verification/pinterest-test-20260820-diagnostic.txt <<EOF
          Pinterest Metricool two-item controlled test media diagnostic
          Test 1 Metricool ID: 364488517
          Test 1 UUID: 5058623714256702120
          Test 1 curl status: $status1
          Test 1 actual SHA256: $sha1
          Test 1 expected SHA256: 0d2a68efd399a74581638d3cf4b4c1fdfe3e0eb595ba18788dac7dbff9ddbddf
          Test 1 actual bytes: $size1
          Test 1 expected bytes: 501465
          Test 1 file: $file1
          Test 2 Metricool ID: 364488725
          Test 2 UUID: 8216556906256355241
          Test 2 curl status: $status2
          Test 2 actual SHA256: $sha2
          Test 2 expected SHA256: cce96d380ce91948fe87322e7b245107447e92c9ef29a1bfe7aec1cfbb283634
          Test 2 actual bytes: $size2
          Test 2 expected bytes: 2688967
          Test 2 file: $file2
          EOF

      - name: Commit diagnostic marker
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'red-river-gorge-hiker-automation'
          git config user.email 'ryan@redrivergorgehiker.com'
          git add metricool-verification/pinterest-test-20260820-diagnostic.txt
          git commit -m 'Record Pinterest Metricool test media diagnostic'
          git push origin HEAD:metricool-verified-media-20260818
