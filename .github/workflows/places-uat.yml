name: Places map browser UAT

on:
  push:
    branches:
      - main
    paths:
      - .places-uat-source-ref
      - tools/places-uat.js
      - .github/workflows/places-uat.yml

permissions:
  contents: read

concurrency:
  group: places-map-uat
  cancel-in-progress: true

jobs:
  places-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout staging control
        uses: actions/checkout@v6

      - name: Resolve exact website source
        id: source
        shell: bash
        run: |
          source_ref="$(head -n 1 .places-uat-source-ref | tr -d '\r\n')"
          test -n "$source_ref"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "Testing exact website source: $source_ref"

      - name: Checkout exact website source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: ${{ steps.source.outputs.source_ref }}
          path: site

      - name: Seed validated route elevation caches
        working-directory: site
        run: node scripts/seed-route-elevation-cache.mjs

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        working-directory: site
        run: npm ci

      - name: Run exact-source checks and build
        working-directory: site
        env:
          SITE_URL: https://redrivergorgehiker.com
          BASE_PATH: /
        run: |
          npm run validate
          npm run validate:routes
          npm run validate:places
          npx astro check
          npm test
          npm run build:site

      - name: Install Chromium UAT runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 http-server@14.1.1
          npx playwright install --with-deps chromium

      - name: Create temporary HTTPS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout rrgh-places-uat-key.pem \
            -out rrgh-places-uat-cert.pem \
            -days 1 \
            -subj "/CN=redrivergorgehiker.com" \
            -addext "subjectAltName=DNS:redrivergorgehiker.com"

      - name: Serve production-equivalent build under production hostname
        shell: bash
        run: |
          npx http-server site/dist -S -C rrgh-places-uat-cert.pem -K rrgh-places-uat-key.pem -p 8443 -a 0.0.0.0 > rrgh-places-uat-server.log 2>&1 &
          for i in {1..30}; do
            if curl -kfsS --resolve redrivergorgehiker.com:8443:127.0.0.1 https://redrivergorgehiker.com:8443/routes/map/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat rrgh-places-uat-server.log
          exit 1

      - name: Run Places map browser UAT
        run: node tools/places-uat.js

      - name: Upload Places UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: places-uat-${{ steps.source.outputs.source_ref }}
          path: |
            places-uat-evidence/
            rrgh-places-uat-server.log
          if-no-files-found: warn
          retention-days: 30
