name: Deploy homepage hero UAT once

on:
  push:
    paths:
      - '.github/workflows/deploy-homepage-hero-uat-once.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homepage source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: 407a3393065c0c25b74efdbe343c8a3b02cf3919
          path: site
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Run website checks
        working-directory: site
        run: npm run check
      - name: Build production target for preserved contract verification
        working-directory: site
        run: npm run build
      - name: Verify homepage-only production target contract
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          dist=Path('dist')
          home=(dist/'index.html').read_text(errors='ignore')
          required=[
            'Kentucky’s Red River Gorge',
            'Red River Gorge Hiker',
            'For the people who hike it, love it, and keep coming back.',
            'Gear, original photography, stories, and proud support for Wolfe County Search &amp; Rescue.',
            'Shop Gear',
            'Explore Photography',
            'How We Support SAR',
            'A simple way to say it.',
            'I’m a Red River Gorge hiker.',
            'The Red River Gorge, captured.',
            'G-HM48NST64P'
          ]
          for token in required:
              if token not in home: raise RuntimeError(f'Missing homepage token: {token}')
          if home.count('Double Rainbow at Eagle') > 1:
              raise RuntimeError('Double Rainbow appears more than once as visible homepage content')
          if 'fineartamerica.com' in home.lower():
              raise RuntimeError('Homepage bypasses internal RRGH routes')
          if 'noindex' in home.lower():
              raise RuntimeError('Production-target homepage contains noindex')
          if 'debug_mode' in home:
              raise RuntimeError('Production-target homepage unexpectedly contains GA4 debug_mode')
          if not re.search(r'<link rel="canonical" href="https://redrivergorgehiker\.com/"', home):
              raise RuntimeError('Homepage canonical is not primary domain')
          if '"@type":"WebSite"' not in home or '"name":"Red River Gorge Hiker"' not in home:
              raise RuntimeError('WebSite structured data missing')
          robots=(dist/'robots.txt').read_text().splitlines()
          if robots != ['User-agent: *','Allow: /','Sitemap: https://redrivergorgehiker.com/sitemap-index.xml']:
              raise RuntimeError(f'Unexpected production robots.txt: {robots!r}')
          xmls=list(dist.glob('sitemap*.xml'))
          locs=[]
          for path in xmls:
              root=ET.parse(path).getroot()
              locs += [e.text.strip() for e in root.iter() if e.tag.endswith('loc') and e.text]
          if not locs or any(not loc.startswith('https://redrivergorgehiker.com') for loc in locs):
              raise RuntimeError('Sitemap URLs are not canonical production URLs')
          print(f'Production target contract verified with {len(locs)} sitemap locations')
          PY
      - name: Build staging target
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: |
          rm -rf dist
          npm run build
      - name: Apply and verify staging safeguards
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          dist=Path('dist')
          meta='<meta name="robots" content="noindex,nofollow,noarchive">'
          pages=list(dist.rglob('*.html'))
          for page in pages:
              text=page.read_text(errors='ignore')
              if '<head>' in text: text=text.replace('<head>','<head>'+meta,1)
              else: text=meta+text
              page.write_text(text)
          (dist/'robots.txt').write_text('User-agent: *\nDisallow: /\n')
          home=(dist/'index.html').read_text(errors='ignore')
          for token in ('home-panorama-hero','For the people who hike it, love it, and keep coming back.','A simple way to say it.','The Red River Gorge, captured.','debug_mode'):
              if token not in home: raise RuntimeError(f'Missing staging token: {token}')
          if meta not in home: raise RuntimeError('Staging noindex missing')
          print(f'Verified {len(pages)} staging pages and homepage hero UAT content')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5
