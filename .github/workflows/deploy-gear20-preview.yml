name: Deploy Gear 20 staging preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-gear20-preview.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Gear 20 feature for staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website feature source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: feature/gear-20-card-refresh
          path: site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run website checks
        working-directory: site
        run: npm run check

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Mark staging output noindex
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          changed = 0
          for page in dist.rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  if '<head>' in text:
                      text = text.replace('<head>', f'<head>{robots_meta}', 1)
                  else:
                      text = robots_meta + text
                  page.write_text(text, encoding='utf-8')
                  changed += 1
          (dist / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          if changed == 0:
              raise RuntimeError('No HTML files received the staging noindex directive')
          print(f'Injected noindex into {changed} HTML files and wrote robots.txt')
          PY

      - name: Verify staging safeguards and Gear 20 output
        working-directory: site
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import xml.etree.ElementTree as ET

          dist = Path('dist')
          base = '/red-river-gorge-hiker-staging/'
          expected_prefix = 'https://ryanredrivergorgehiker.github.io' + base
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'

          html_files = list(dist.rglob('*.html'))
          if not html_files:
              raise RuntimeError('No generated HTML files found')

          class URLParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in {'href', 'src'} and value:
                          self.urls.append((tag, key, value))

          bad_urls = []
          for page in html_files:
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  raise RuntimeError(f'Missing noindex directive in {page}')
              parser = URLParser()
              parser.feed(text)
              for tag, key, value in parser.urls:
                  if value.startswith('/') and not value.startswith('//') and not value.startswith(base):
                      bad_urls.append(f'{page}: <{tag}> {key}={value}')
          if bad_urls:
              raise RuntimeError('Root-relative URLs escaped staging base:\n' + '\n'.join(bad_urls[:20]))

          if (dist / 'robots.txt').read_text(encoding='utf-8').splitlines() != ['User-agent: *', 'Disallow: /']:
              raise RuntimeError('Unexpected robots.txt content')

          locs = []
          for sitemap in dist.glob('sitemap*.xml'):
              root = ET.parse(sitemap).getroot()
              for elem in root.iter():
                  if elem.tag.endswith('loc') and elem.text:
                      locs.append(elem.text.strip())
          if not locs or any(not loc.startswith(expected_prefix) for loc in locs):
              raise RuntimeError('Staging sitemap URLs are invalid')

          gear = (dist / 'gear' / 'index.html').read_text(encoding='utf-8')
          required = [
              'Men’s T-Shirt (Athletic Fit) — Chest Logo',
              'Men’s T-Shirt (Regular Fit)',
              'Women’s T-Shirt',
              'Sweatshirt',
              'Men’s T-Shirt (Athletic Fit) — Pocket Logo',
              'Women’s Tank Top',
              'Youth T-Shirt',
              'Kids T-Shirt',
              'Baby One-Piece',
              'rrgh-merch-tshirt-pocket-v3-e3c01e3d.avif',
          ]
          for token in required:
              if token not in gear:
                  raise RuntimeError(f'Missing Gear 20 staging token: {token}')
          if gear.count('class="merch-card"') != 20:
              raise RuntimeError('Staging Gear page does not contain exactly 20 cards')

          print(f'Verified {len(html_files)} HTML files, staging safeguards, sitemap, and 20-card Gear output.')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy Gear 20 staging preview
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5

  cleanup:
    name: Remove one-time preview workflow
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging control repository
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/deploy-gear20-preview.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove one-time Gear 20 preview workflow"
          git push origin HEAD:main
