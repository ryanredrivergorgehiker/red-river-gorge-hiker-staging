name: Deploy homepage mobile CTA staging preview

on:
  push:
    paths:
      - '.github/workflows/deploy-home-mobile-cta-once.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact website source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: fdd67410fe624fb1a8a28c3edad139b1fb693d66
          path: site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run website checks
        working-directory: site
        run: npm run check

      - name: Verify homepage mobile CTA contract
        working-directory: site
        run: |
          grep -q '@media (max-width: 620px)' src/styles/home-brand.css
          grep -q 'align-items: flex-start' src/styles/home-brand.css
          grep -q 'width: min(13rem, 100%)' src/styles/home-brand.css
          grep -q 'padding-top: 0 !important' src/styles/home-brand.css
          grep -q 'align-items: end !important' src/styles/home-brand.css
          ! grep -q 'background-' src/styles/home-brand.css

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Mark staging output noindex
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          marker='<meta name="robots" content="noindex,nofollow,noarchive">'
          for page in Path('dist').rglob('*.html'):
              text=page.read_text(encoding='utf-8')
              if marker not in text:
                  text=text.replace('<head>', '<head>'+marker, 1)
                  page.write_text(text, encoding='utf-8')
          Path('dist/robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          PY
          grep -q 'noindex,nofollow,noarchive' dist/index.html
          test "$(cat dist/robots.txt)" = $'User-agent: *\nDisallow: /'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5
