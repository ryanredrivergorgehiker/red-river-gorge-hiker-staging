name: Pixels cross-origin country-source diagnostic

on:
  push:
    branches:
      - diagnostic/pixels-cors-20260914

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract current public Store RRGH analytics script
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --header 'Cache-Control: no-cache' \
            'https://store.redrivergorgehiker.com/' -o body.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('body.html').read_text(errors='replace')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>', text, flags=re.I|re.S)
          for script in scripts:
              if 'rrgh-store-analytics-consent-v1' in script:
                  print(script.strip())
                  break
          else:
              raise SystemExit('RRGH Store analytics script not found')
          PY
