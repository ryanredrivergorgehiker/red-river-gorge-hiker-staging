name: Pixels cross-origin country-source diagnostic

on:
  push:
    branches:
      - diagnostic/pixels-cors-20260914

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Extract live Store analytics bar code context
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --header 'Cache-Control: no-cache' \
            'https://store.redrivergorgehiker.com/' -o body.html
          python3 - <<'PY'
          from pathlib import Path
          text=Path('body.html').read_text(errors='replace')
          for needle in ['rrghAnalyticsToggle','rrgh-store-analytics-consent-v1','enterzipcode.php','regional-default-on']:
              low=text.lower(); n=needle.lower(); start=0; count=0
              while True:
                  i=low.find(n,start)
                  if i<0: break
                  count += 1
                  lo=max(0,i-3500); hi=min(len(text),i+6500)
                  print(f'=== {needle} occurrence {count} @ {i} ===')
                  print(text[lo:hi])
                  start=i+len(n)
                  if count>=2: break
              if count==0:
                  print(f'=== {needle}: not found ===')
          PY
