name: Pixels cross-origin country-source diagnostic

on:
  push:
    branches:
      - diagnostic/pixels-cors-20260914

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pixels Cabin font definition
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --header 'Cache-Control: no-cache' \
            'https://store.redrivergorgehiker.com/' -o body.html
          python3 - <<'PY'
          import re, subprocess
          from pathlib import Path
          html=Path('body.html').read_text(errors='replace')
          hrefs=re.findall(r"<link[^>]+href=['\"]([^'\"]+\.css(?:\?[^'\"]*)?)['\"]", html, flags=re.I)
          seen=set()
          for href in hrefs:
              if href in seen: continue
              seen.add(href)
              if href.startswith('//'):
                  url='https:'+href
              elif href.startswith('/'):
                  url='https://store.redrivergorgehiker.com'+href
              elif href.startswith('http://') or href.startswith('https://'):
                  url=href
              else:
                  url='https://store.redrivergorgehiker.com/'+href
              completed=subprocess.run(['curl','--fail','--silent','--show-error',url], text=True, capture_output=True)
              if completed.returncode != 0:
                  continue
              css=completed.stdout
              for m in re.finditer(r'@font-face\s*\{([^}]*)\}', css, flags=re.I|re.S):
                  body=' '.join(m.group(1).split())
                  if 'cabin' in body.lower():
                      print(f'CSS={url}')
                      print('@font-face { '+body+' }')
          PY
