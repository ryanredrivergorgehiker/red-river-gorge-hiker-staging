name: Pixels cross-origin country-source diagnostic

on:
  push:
    branches:
      - diagnostic/pixels-cors-20260914

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Store tracker source order
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --header 'Cache-Control: no-cache' \
            'https://store.redrivergorgehiker.com/' -o body.html
          python3 - <<'PY'
          from pathlib import Path
          text=Path('body.html').read_text(errors='replace')
          needles=[
            'rrghAnalyticsToggle',
            'rrgh-store-analytics-consent-v1',
            'googletagmanager.com',
            'fbevents.js',
            'facebook pixel',
            'GTM-WWP8KCM2'
          ]
          for needle in needles:
              positions=[]
              start=0
              low=text.lower(); n=needle.lower()
              while True:
                  i=low.find(n,start)
                  if i<0: break
                  positions.append(i); start=i+len(n)
              print(f'{needle}: {positions[:10]}')
          PY
