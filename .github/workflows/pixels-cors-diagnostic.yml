name: Pixels cross-origin country-source diagnostic

on:
  push:
    branches:
      - diagnostic/pixels-cors-20260914

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pixels public container geometry
        shell: bash
        run: |
          set -euo pipefail
          URL='https://store.redrivergorgehiker.com/'
          curl --fail --silent --show-error --header 'Cache-Control: no-cache' --output body.html "${URL}"
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('body.html').read_text(errors='replace')
          hrefs = re.findall(r'<link[^>]+href=["\']([^"\']+\.css[^"\']*)', text, flags=re.I)
          print('STYLESHEETS')
          for href in dict.fromkeys(hrefs):
              print(href)
          PY
          python3 - <<'PY' > css_urls.txt
          import re
          from pathlib import Path
          from urllib.parse import urljoin
          text = Path('body.html').read_text(errors='replace')
          for href in dict.fromkeys(re.findall(r'<link[^>]+href=["\']([^"\']+\.css[^"\']*)', text, flags=re.I)):
              print(urljoin('https://store.redrivergorgehiker.com/', href))
          PY
          i=0
          while IFS= read -r css; do
            i=$((i+1))
            curl --fail --silent --show-error "$css" -o "sheet-${i}.css" || continue
            echo "=== $css ==="
            python3 - "$i" <<'PY'
          import re, sys
          from pathlib import Path
          text=Path(f'sheet-{sys.argv[1]}.css').read_text(errors='replace')
          for pat in [r'\.container\s*\{[^}]*\}', r'#headerAnnouncementWhiteLabelDiv\s*\{[^}]*\}', r'#headerAnnouncementWhiteLabelText\s*\{[^}]*\}']:
              for m in re.finditer(pat,text,flags=re.I|re.S):
                  print(re.sub(r'\s+',' ',m.group(0)).strip())
          PY
          done < css_urls.txt
