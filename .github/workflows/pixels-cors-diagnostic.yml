name: Pixels cross-origin country-source diagnostic

on:
  push:
    branches:
      - diagnostic/pixels-cors-20260914

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Capture Pixels container media contexts
        shell: bash
        run: |
          set -euo pipefail
          for css in \
            'https://store.redrivergorgehiker.com/css/stylesheet.css?v=39b560d48b' \
            'https://store.redrivergorgehiker.com/css/whiteLabelWebsites/stylesheetHeader.css?v=39b560d48b'; do
            echo "=== $css ==="
            curl --fail --silent --show-error "$css" -o sheet.css
            python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('sheet.css').read_text(errors='replace')
          for m in re.finditer(r'\.container\s*\{[^}]*\}',text,flags=re.I|re.S):
              lo=max(0,m.start()-500); hi=min(len(text),m.end()+120)
              print(re.sub(r'\s+',' ',text[lo:hi]).strip())
              print('---')
          PY
          done
