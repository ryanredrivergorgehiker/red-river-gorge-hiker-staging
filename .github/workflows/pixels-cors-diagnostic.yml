name: Pixels cross-origin country-source diagnostic

on:
  push:
    branches:
      - diagnostic/pixels-cors-20260914

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Cloudflare trace CORS and Pixels Cabin font
        shell: bash
        run: |
          set -euo pipefail
          for origin in 'https://redrivergorgehiker.com' 'https://ryanredrivergorgehiker.github.io'; do
            for endpoint in 'https://one.one.one.one/cdn-cgi/trace' 'https://www.cloudflare.com/cdn-cgi/trace'; do
              echo "=== TRACE endpoint=$endpoint origin=$origin ==="
              curl --silent --show-error --location --dump-header trace-headers.txt --output trace-body.txt \
                --header "Origin: $origin" --header 'Cache-Control: no-cache' "$endpoint" || true
              grep -iE '^(HTTP/|access-control-allow-origin:|content-type:|cache-control:)' trace-headers.txt || true
              grep -E '^loc=' trace-body.txt || true
            done
          done

          echo '=== PIXELS CABIN FONT HEADERS ==='
          curl --silent --show-error --location --head \
            --header 'Origin: https://redrivergorgehiker.com' \
            'https://render.fineartamerica.com/font/cabinregular.woff' \
            | grep -iE '^(HTTP/|access-control-allow-origin:|content-type:|cache-control:)' || true
