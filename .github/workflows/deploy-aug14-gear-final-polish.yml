name: Deploy Aug 14 Gear final polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-aug14-gear-final-polish.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Aug 14 Gear final polish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: 5e122fa90184b025d6024029758898c561f7b541
          path: site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run website checks
        working-directory: site
        run: npm run check

      - name: Verify final Gear-page polish
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path

          gear = Path('src/pages/gear.astro').read_text(encoding='utf-8')
          css = Path('src/styles/merchandise.css').read_text(encoding='utf-8')

          if '<p class="eyebrow">Red River Gorge Hiker gear</p>' in gear:
              raise RuntimeError('Redundant visible Gear eyebrow still present')
          if '<header class="merch-hero">\n      <h1>Gear</h1>\n    </header>' not in gear:
              raise RuntimeError('Gear page is not using the single visible Gear heading')
          if '.merch-policy-notices {\n  margin-top: 1.5rem;\n}' not in css:
              raise RuntimeError('Policy notice spacing contract missing')
          if '.merch-hero h1 {\n  margin: 0;\n}' not in css:
              raise RuntimeError('Tight Gear heading spacing contract missing')
          if '.merchandise-catalog {\n  margin-top: 1.25rem;\n}' not in css:
              raise RuntimeError('Tight Gear catalog spacing contract missing')

          print('Final Gear-page polish source checks passed')
          PY

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Mark staging output noindex
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path

          dist = Path('dist')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          changed = 0
          for page in dist.rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  if '<head>' in text:
                      text = text.replace('<head>', f'<head>{robots_meta}', 1)
                  else:
                      text = robots_meta + text
                  page.write_text(text, encoding='utf-8')
                  changed += 1
          (dist / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          if changed == 0:
              raise RuntimeError('No HTML files received staging noindex')
          print(f'Injected noindex into {changed} HTML files')
          PY

      - name: Verify staging safeguards
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          dist = Path('dist')
          base = '/red-river-gorge-hiker-staging/'
          expected_prefix = 'https://ryanredrivergorgehiker.github.io' + base
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'

          html_files = list(dist.rglob('*.html'))
          if not html_files:
              raise RuntimeError('No generated HTML files')
          for page in html_files:
              if robots_meta not in page.read_text(encoding='utf-8'):
                  raise RuntimeError(f'Missing noindex in {page}')

          if (dist / 'robots.txt').read_text(encoding='utf-8').splitlines() != ['User-agent: *', 'Disallow: /']:
              raise RuntimeError('Unexpected staging robots.txt')

          locs = []
          for sitemap in dist.glob('sitemap*.xml'):
              root = ET.parse(sitemap).getroot()
              for elem in root.iter():
                  if elem.tag.endswith('loc') and elem.text:
                      locs.append(elem.text.strip())
          if not locs or any(not loc.startswith(expected_prefix) for loc in locs):
              raise RuntimeError('Staging sitemap URL/base verification failed')

          print(f'Verified {len(html_files)} staging HTML files and safeguards')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy staging Pages site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5
