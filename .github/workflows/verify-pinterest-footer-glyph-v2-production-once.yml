name: Verify Pinterest footer glyph V2 in production once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-pinterest-footer-glyph-v2-production-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live production custom domain
        run: |
          python - <<'PY'
          import json, time, urllib.request

          url = 'https://redrivergorgehiker.com/?pinterest-glyph-v2=1'
          new_markers = [
              'https://www.pinterest.com/redrivergorgehiker/',
              'aria-label="Red River Gorge Hiker on Pinterest"',
              'transform="translate(7.6 4.6) scale(0.04375)"',
              'M204 6.5c-102.6 0-204 68.4-204 179.1',
              'https://www.instagram.com/redrivergorgehiker/',
              'https://www.facebook.com/profile.php?id=61593038581429',
              'G-HM48NST64P',
              '2613133188222',
          ]
          old_marker = 'M16 6.2c-5.4 0-8.2 3.9-8.2 7.1'

          for attempt in range(30):
              try:
                  req = urllib.request.Request(url, headers={
                      'Cache-Control': 'no-cache, no-store',
                      'Pragma': 'no-cache',
                      'User-Agent': 'RRGH-production-verifier',
                  })
                  with urllib.request.urlopen(req, timeout=20) as response:
                      html = response.read().decode('utf-8')
                  missing = [marker for marker in new_markers if marker not in html]
                  if not missing and old_marker not in html and 'noindex,nofollow,noarchive' not in html and 'debug_mode' not in html:
                      print('Live production Pinterest footer glyph V2 verification passed')
                      raise SystemExit(0)
                  print(f'Attempt {attempt + 1}: missing={missing}, old_present={old_marker in html}')
              except Exception as exc:
                  print(f'Attempt {attempt + 1}: {exc}')
              time.sleep(10)

          raise RuntimeError('Production did not serve the verified Pinterest footer glyph V2 in time')
          PY

      - name: Record successful production verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/report.json <<'JSON'
          {
            "status": "SUCCESS",
            "productionCommit": "1c3973ab28cd57c4461fc7e9ec5ebbe6d739e878",
            "productionUrl": "https://redrivergorgehiker.com/",
            "newGlyphPresent": true,
            "oldGlyphAbsent": true,
            "pinterestProfilePreserved": true,
            "sameAsProfilesPreserved": true,
            "analyticsIdentifiersPreserved": true,
            "productionNoindexAbsent": true,
            "debugModeAbsent": true
          }
          JSON
          encoded="$(base64 -w0 /tmp/report.json)"
          gh api --method PUT repos/ryanredrivergorgehiker/red-river-gorge-hiker-staging/contents/PRODUCTION-PINTEREST-FOOTER-GLYPH-V2-VERIFIED.json \
            -f message='Record production Pinterest footer glyph V2 verification' \
            -f content="$encoded" \
            -f branch='main'
