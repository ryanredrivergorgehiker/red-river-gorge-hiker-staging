name: Deploy homepage hero consistency once

on:
  push:
    paths:
      - '.github/workflows/deploy-home-hero-consistency-once.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact website source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: d9c74113b45426f0bc2f2fa36713f279c0f8aa68
          path: site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run website checks
        working-directory: site
        run: npm run check

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Verify homepage uses SAR hero implementation
        working-directory: site
        run: |
          grep -q "import '../styles/sar.css'" src/pages/index.astro
          grep -q 'class="sar-hero home-hero"' src/pages/index.astro
          grep -q 'class="sar-hero-media"' src/pages/index.astro
          grep -q 'catalogId="RRGH-0001"' src/pages/index.astro
          ! grep -q 'winter-red-byrd' src/styles/home-brand.css
          grep -q 'align-items: start' src/styles/home-brand.css

      - name: Mark staging output noindex
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          changed = 0
          for page in dist.rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  if '<head>' in text:
                      text = text.replace('<head>', f'<head>{robots_meta}', 1)
                  else:
                      text = robots_meta + text
                  page.write_text(text, encoding='utf-8')
                  changed += 1
          (dist / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          if changed == 0:
              raise RuntimeError('No HTML files received the staging noindex directive')
          PY

      - name: Verify staging safeguards
        working-directory: site
        run: |
          grep -q 'noindex,nofollow,noarchive' dist/index.html
          test "$(cat dist/robots.txt)" = $'User-agent: *\nDisallow: /'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5
