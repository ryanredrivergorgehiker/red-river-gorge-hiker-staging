name: Routes & Tracks browser/network UAT

on:
  push:
    branches:
      - main
    paths:
      - .routes-uat-source-ref
      - tools/routes-tracks-uat.js
      - .github/workflows/routes-tracks-uat.yml

permissions:
  contents: read

concurrency:
  group: routes-tracks-uat-v2
  cancel-in-progress: true

jobs:
  routes-tracks-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staging control
        uses: actions/checkout@v6

      - name: Resolve exact website source
        id: source
        shell: bash
        run: |
          source_ref="$(head -n 1 .routes-uat-source-ref | tr -d '\r\n')"
          test -n "$source_ref"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "Testing exact website source: $source_ref"

      - name: Probe live Census TIGERweb Local Roads service
        shell: bash
        run: |
          query='https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_PhysicalFeatures/MapServer/5/query?where=1%3D1&geometry=%7B%22xmin%22%3A-83.550%2C%22ymin%22%3A37.815%2C%22xmax%22%3A-83.532%2C%22ymax%22%3A37.829%2C%22spatialReference%22%3A%7B%22wkid%22%3A4326%7D%7D&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=OID%2CNAME%2CBASENAME&returnGeometry=true&returnZ=false&returnM=false&outSR=4326&resultRecordCount=25&f=geojson'
          echo '--- HEADERS WITH RRGH ORIGIN ---'
          curl -fsS -D /tmp/local-road-headers.txt -H 'Origin: https://redrivergorgehiker.com' "$query" -o /tmp/local-roads.json
          cat /tmp/local-road-headers.txt
          echo '--- BODY PREFIX ---'
          head -c 1200 /tmp/local-roads.json || true
          echo
          echo '--- PARSE / ACCEPTANCE ---'
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/local-roads.json','utf8'));
          if (data?.error) throw new Error(JSON.stringify(data.error));
          const features = Array.isArray(data.features) ? data.features : [];
          const known = new Set(['110206092766','110206092933','110206092934','110206092773']);
          const matches = features.filter(f => {
            const p = f?.properties || {};
            const name = String(p.NAME || p.BASENAME || '');
            return known.has(String(p.OID || '')) || /(?:old\s+)?clif{1,2}ty\s+school/i.test(name);
          });
          console.log(JSON.stringify({
            featureCount: features.length,
            matches: matches.map(f => ({
              OID: f?.properties?.OID || null,
              NAME: f?.properties?.NAME || null,
              BASENAME: f?.properties?.BASENAME || null
            }))
          }, null, 2));
          if (!matches.length) throw new Error('TIGERweb did not return Clifty/Cliffty School Road in the acceptance viewport');
          NODE

      - name: Checkout exact website source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: ${{ steps.source.outputs.source_ref }}
          path: site

      - name: Seed validated Skybridge elevation cache
        working-directory: site
        shell: bash
        run: |
          route_json_blob="$(git rev-parse HEAD:src/data/routes/skybridge-arch.json)"
          route_geo_blob="$(git rev-parse HEAD:public/data/routes/skybridge-arch-v1.geojson)"
          route_gpx_blob="$(git rev-parse HEAD:public/downloads/routes/Skybridge_Arch_APPROVED_v1.gpx)"

          if [ "$route_json_blob" != "61e2c76339799420df38bb86442c774e8d3d1cab" ] \
            || [ "$route_geo_blob" != "7845938e72579cde013178f9eaceb7dba9fb8234" ] \
            || [ "$route_gpx_blob" != "0e9575f0d5567f70ccc1701ab72c40992afc4628" ]; then
            echo "Route inputs changed; refusing to reuse cached elevation data." >&2
            exit 1
          fi

          mkdir -p public/data/routes
          cp .ci-cache/skybridge-arch.elevation.json public/data/routes/skybridge-arch.elevation.json
          echo "Seeded validated Skybridge elevation artifact for unchanged route inputs."

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        working-directory: site
        run: npm ci

      - name: Run full repository checks
        working-directory: site
        env:
          SITE_URL: https://redrivergorgehiker.com
          BASE_PATH: /
        # Match source CI's exact-input guarded cache path. Keep every validation,
        # contract test and build; avoid a live request for unchanged route inputs.
        run: |
          npm run validate
          npm run validate:routes
          npx astro check
          npm test
          npm run build:site

      - name: Build exact source production-equivalently
        working-directory: site
        env:
          SITE_URL: https://redrivergorgehiker.com
          BASE_PATH: /
        run: npm run build:site

      - name: Install Chromium UAT runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 http-server@14.1.1
          npx playwright install --with-deps chromium

      - name: Create temporary HTTPS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout rrgh-routes-uat-key.pem \
            -out rrgh-routes-uat-cert.pem \
            -days 1 \
            -subj "/CN=redrivergorgehiker.com" \
            -addext "subjectAltName=DNS:redrivergorgehiker.com"

      - name: Serve production-equivalent build under production hostname
        shell: bash
        run: |
          npx http-server site/dist -S -C rrgh-routes-uat-cert.pem -K rrgh-routes-uat-key.pem -p 8443 -a 0.0.0.0 > rrgh-routes-uat-server.log 2>&1 &
          for i in {1..30}; do
            if curl -kfsS --resolve redrivergorgehiker.com:8443:127.0.0.1 https://redrivergorgehiker.com:8443/routes/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat rrgh-routes-uat-server.log
          exit 1

      - name: Run Routes & Tracks browser/network UAT
        run: node tools/routes-tracks-uat.js

      - name: Upload Routes & Tracks UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routes-tracks-uat-${{ steps.source.outputs.source_ref }}
          path: |
            routes-tracks-uat-evidence/
            rrgh-routes-uat-server.log
          if-no-files-found: warn
          retention-days: 30
