name: Deploy latest Gear and SAR refinements to staging

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-gear20-sar-preview.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build exact feature head for staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website feature source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: bff181d8ceef677682f351834a575e6496ade1db
          path: site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run website checks
        working-directory: site
        run: npm run check

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Mark staging output noindex
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          changed = 0
          for page in dist.rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  if '<head>' in text:
                      text = text.replace('<head>', f'<head>{robots_meta}', 1)
                  else:
                      text = robots_meta + text
                  page.write_text(text, encoding='utf-8')
                  changed += 1
          (dist / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          if changed == 0:
              raise RuntimeError('No HTML files received the staging noindex directive')
          print(f'Injected noindex into {changed} HTML files and wrote robots.txt')
          PY

      - name: Verify staging safeguards and requested refinements
        working-directory: site
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import hashlib
          import xml.etree.ElementTree as ET

          dist = Path('dist')
          base = '/red-river-gorge-hiker-staging/'
          expected_prefix = 'https://ryanredrivergorgehiker.github.io' + base
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'

          html_files = list(dist.rglob('*.html'))
          if not html_files:
              raise RuntimeError('No generated HTML files found')

          class URLParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in {'href', 'src'} and value:
                          self.urls.append((tag, key, value))

          bad_urls = []
          for page in html_files:
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  raise RuntimeError(f'Missing noindex directive in {page}')
              parser = URLParser()
              parser.feed(text)
              for tag, key, value in parser.urls:
                  if value.startswith('/') and not value.startswith('//') and not value.startswith(base):
                      bad_urls.append(f'{page}: <{tag}> {key}={value}')
          if bad_urls:
              raise RuntimeError('Root-relative URLs escaped the staging base:\n' + '\n'.join(bad_urls[:20]))

          if (dist / 'robots.txt').read_text(encoding='utf-8').splitlines() != ['User-agent: *', 'Disallow: /']:
              raise RuntimeError('Unexpected robots.txt')

          sitemap_files = list(dist.glob('sitemap*.xml'))
          locs = []
          for sitemap in sitemap_files:
              root = ET.parse(sitemap).getroot()
              for elem in root.iter():
                  if elem.tag.endswith('loc') and elem.text:
                      locs.append(elem.text.strip())
          if not locs or any(not loc.startswith(expected_prefix) for loc in locs):
              raise RuntimeError('Staging sitemap URL/base verification failed')

          sar_page = (dist / 'search-and-rescue' / 'index.html').read_text(encoding='utf-8')
          required = [
              'Its capabilities include wilderness searches',
              'The controlling Forest Service information for the Red River Gorge Geological Area says that',
              'Download 2026 DBNF dispersed camping guide',
              'This site deliberately links to authoritative sources',
          ]
          for token in required:
              if token not in sar_page:
                  raise RuntimeError(f'Missing requested SAR staging text: {token}')
          forbidden = [
              'publicly described capabilities',
              'Check current Forest Service rules before your trip',
              'This launch version deliberately links',
          ]
          for token in forbidden:
              if token in sar_page:
                  raise RuntimeError(f'Stale SAR staging text remains: {token}')

          guide = dist / 'downloads' / 'red-river-gorge-hiker-2026-dbnf-dispersed-camping-guide.pdf'
          if not guide.exists():
              raise RuntimeError('DBNF guide is missing from staging output')
          digest = hashlib.sha256(guide.read_bytes()).hexdigest()
          if digest != '9945908c99ec376d1447b190fcb305ed92b7bcd0add73974751ead5ab32d982d':
              raise RuntimeError(f'DBNF guide hash mismatch: {digest}')

          gear_page = (dist / 'gear' / 'index.html').read_text(encoding='utf-8')
          for title in [
              'Men’s T-Shirt (Athletic Fit) — Chest Logo',
              'Men’s T-Shirt (Regular Fit)',
              'Women’s T-Shirt',
              'Sweatshirt',
              'Women’s Tank Top',
              'Youth T-Shirt',
              'Kids T-Shirt',
              'Baby One-Piece',
          ]:
              if title not in gear_page:
                  raise RuntimeError(f'Missing Gear staging product: {title}')

          print(f'Verified staging safeguards, {len(locs)} sitemap URLs, Gear 20 additions, requested SAR copy, and DBNF guide hash.')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy combined staging preview
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5

  cleanup:
    name: Remove one-time preview workflow
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging control repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-time workflow
        run: |
          set -euo pipefail
          if [ -f .github/workflows/deploy-gear20-sar-preview.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm .github/workflows/deploy-gear20-sar-preview.yml
            git commit -m "Remove one-time Gear and SAR staging workflow"
            git push origin HEAD:main
          fi
