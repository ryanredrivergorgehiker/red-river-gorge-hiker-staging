name: Deploy final puzzle visual-size UAT once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-final-puzzle-visual-size-once.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: 678edb494da06e670950affb6ab081415b6b0b59
          path: site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run website checks
        working-directory: site
        run: npm run check

      - name: Verify puzzle visible-scale normalization
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('src/pages/puzzles.astro').read_text()
          for token in ('cardScale: 1.053', 'cardScale: 1.017', 'cardScale: 1,', 'transform: scale(var(--puzzle-card-scale, 1));'):
              if token not in text:
                  raise RuntimeError(f'Missing puzzle visual normalization rule: {token}')
          print('Puzzle visible-scale normalization verified')
          PY

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Mark staging output noindex
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          changed = 0
          for page in dist.rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  text = text.replace('<head>', f'<head>{robots_meta}', 1) if '<head>' in text else robots_meta + text
                  page.write_text(text, encoding='utf-8')
                  changed += 1
          (dist / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          if changed == 0:
              raise RuntimeError('No HTML files received staging noindex')
          PY

      - name: Verify staging safeguards and puzzle route
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          if not (dist / 'puzzles' / 'index.html').exists():
              raise RuntimeError('Puzzle overview route missing')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          for page in dist.rglob('*.html'):
              if robots_meta not in page.read_text(encoding='utf-8'):
                  raise RuntimeError(f'Missing noindex in {page}')
          if (dist / 'robots.txt').read_text().splitlines() != ['User-agent: *', 'Disallow: /']:
              raise RuntimeError('Unexpected robots.txt')
          print('Staging safeguards and puzzle route verified')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5
