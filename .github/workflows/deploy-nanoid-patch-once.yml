name: Deploy Nano ID patch staging preview

on:
  push:
    paths:
      - '.github/workflows/deploy-nanoid-patch-once.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact website source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: e584bacdf13d8f95c5946bf977f4e09dca6e0e8d
          path: site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Verify patched Nano ID resolution
        working-directory: site
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json')
          const p = lock.packages['node_modules/nanoid']
          if (!p || p.version !== '3.3.18') throw new Error(JSON.stringify(p))
          console.log('nanoid', p.version, p.resolved)
          NODE

      - name: Run full npm audit
        working-directory: site
        run: npm audit

      - name: Run npm audit JSON and verify zero vulnerabilities
        working-directory: site
        run: |
          npm audit --json | tee /tmp/npm-audit.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/npm-audit.json'))
          vulns=data.get('metadata',{}).get('vulnerabilities',{})
          assert sum(v for v in vulns.values() if isinstance(v,int)) == 0, vulns
          print('zero vulnerabilities:', vulns)
          PY

      - name: Verify production dependency audit
        working-directory: site
        run: npm audit --omit=dev --audit-level=high

      - name: Run full website checks
        working-directory: site
        run: npm run check

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Mark staging output noindex
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          marker='<meta name="robots" content="noindex,nofollow,noarchive">'
          for page in Path('dist').rglob('*.html'):
              text=page.read_text(encoding='utf-8')
              if marker not in text:
                  text=text.replace('<head>', '<head>'+marker, 1)
                  page.write_text(text, encoding='utf-8')
          Path('dist/robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          PY
          grep -q 'noindex,nofollow,noarchive' dist/index.html
          test "$(cat dist/robots.txt)" = $'User-agent: *\nDisallow: /'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5
