name: Deploy Pinterest footer glyph V2 to staging once

on:
  push:
    branches:
      - deploy/pinterest-footer-glyph-v2
    paths:
      - .github/workflows/deploy-pinterest-footer-glyph-v2-once.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Pinterest footer glyph V2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: 1c3973ab28cd57c4461fc7e9ec5ebbe6d739e878
          path: site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run full website checks
        working-directory: site
        run: npm run check

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Mark staging output noindex
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          changed = 0
          for page in dist.rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  if '<head>' in text:
                      text = text.replace('<head>', f'<head>{robots_meta}', 1)
                  else:
                      text = robots_meta + text
                  page.write_text(text, encoding='utf-8')
                  changed += 1
          (dist / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          if changed == 0:
              raise RuntimeError('No HTML files received staging noindex')
          print(f'Injected noindex into {changed} HTML files')
          PY

      - name: Verify candidate and staging safeguards
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          html_files = list(Path('dist').rglob('*.html'))
          if len(html_files) != 44:
              raise RuntimeError(f'Expected 44 HTML pages, found {len(html_files)}')
          home = Path('dist/index.html').read_text(encoding='utf-8')
          required = [
              'https://www.pinterest.com/redrivergorgehiker/',
              'aria-label="Red River Gorge Hiker on Pinterest"',
              'transform="translate(7.6 4.6) scale(0.04375)"',
              'M204 6.5c-102.6 0-204 68.4-204 179.1',
          ]
          for marker in required:
              if marker not in home:
                  raise RuntimeError(f'Missing expected Pinterest glyph marker: {marker}')
          old = 'M16 6.2c-5.4 0-8.2 3.9-8.2 7.1'
          if old in home:
              raise RuntimeError('Old Pinterest glyph is still present')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          for page in html_files:
              if robots_meta not in page.read_text(encoding='utf-8'):
                  raise RuntimeError(f'Missing staging noindex: {page}')
          robots = Path('dist/robots.txt').read_text(encoding='utf-8').splitlines()
          if robots != ['User-agent: *', 'Disallow: /']:
              raise RuntimeError(f'Unexpected robots.txt: {robots!r}')
          print('Verified 44 pages, Pinterest glyph V2, and staging crawl safeguards')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy and live-verify staging
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify live staging footer glyph
        run: |
          python - <<'PY'
          import time, urllib.request
          url = 'https://ryanredrivergorgehiker.github.io/red-river-gorge-hiker-staging/?glyphv2=1'
          markers = [
              'https://www.pinterest.com/redrivergorgehiker/',
              'transform="translate(7.6 4.6) scale(0.04375)"',
              'M204 6.5c-102.6 0-204 68.4-204 179.1',
              'noindex,nofollow,noarchive',
          ]
          for attempt in range(18):
              try:
                  req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'RRGH-staging-verifier'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      html = response.read().decode('utf-8')
                  if all(marker in html for marker in markers):
                      print('Live staging verification passed')
                      raise SystemExit(0)
              except Exception as exc:
                  print(f'Attempt {attempt + 1}: {exc}')
              time.sleep(10)
          raise RuntimeError('Live staging did not serve the verified Pinterest glyph V2 in time')
          PY
