name: Deploy Aug 14 UAT staging

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-aug14-uat.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Aug 14 UAT source for staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: f3719c0bd35e6eca32d13f7e8a3de3df125ba0d7
          path: site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Run website checks
        working-directory: site
        run: npm run check

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Verify Aug 14 UAT implementation
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          dist = Path('dist')
          base = '/red-river-gorge-hiker-staging/'

          required = [
              dist / 'photography/index.html',
              dist / 'collection/index.html',
              dist / 'prints/index.html',
              dist / 'puzzles/ice-at-west-of-copperas-pillar/index.html',
              dist / 'photographs/ice-at-west-of-copperas-pillar/index.html',
              dist / 'gear/sticker/index.html',
              dist / 'about/index.html',
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise RuntimeError('Missing UAT pages: ' + ', '.join(missing))

          home = (dist / 'index.html').read_text(encoding='utf-8')
          photo = (dist / 'photographs/ice-at-west-of-copperas-pillar/index.html').read_text(encoding='utf-8')
          gear = (dist / 'gear/sticker/index.html').read_text(encoding='utf-8')
          about = (dist / 'about/index.html').read_text(encoding='utf-8')
          photography = (dist / 'photography/index.html').read_text(encoding='utf-8')

          checks = {
              'home Photography destination': f'{base}photography/' in home,
              'home About RRGH block': 'About Red River Gorge Hiker' in home and 'Our Story' in home,
              'photo internal puzzle route': f'{base}puzzles/ice-at-west-of-copperas-pillar/' in photo,
              'gear side-by-side action wrapper': 'gear-product-action-row' in gear,
              'new About copy': 'About Red River Gorge Hiker' in about and 'The Gorge is the point' in about,
              'Photography page': '>Photography<' in photography,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise RuntimeError('UAT implementation checks failed: ' + ', '.join(failed))

          sitemap_files = list(dist.glob('sitemap*.xml'))
          locs = []
          for sitemap in sitemap_files:
              root = ET.parse(sitemap).getroot()
              for elem in root.iter():
                  if elem.tag.endswith('loc') and elem.text:
                      locs.append(elem.text.strip())
          joined = '\n'.join(locs)
          if f'{base}photography/' not in joined:
              raise RuntimeError('Photography page missing from sitemap')
          for legacy in ('/collection/', '/prints/', '/merchandise/'):
              if any(url.endswith(legacy) for url in locs):
                  raise RuntimeError(f'Legacy redirect leaked into sitemap: {legacy}')

          print('Aug 14 UAT implementation checks passed')
          PY

      - name: Mark staging output noindex
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path

          dist = Path('dist')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          changed = 0

          for page in dist.rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  if '<head>' in text:
                      text = text.replace('<head>', f'<head>{robots_meta}', 1)
                  else:
                      text = robots_meta + text
                  page.write_text(text, encoding='utf-8')
                  changed += 1

          (dist / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          if changed == 0:
              raise RuntimeError('No HTML files received the staging noindex directive')
          print(f'Injected noindex into {changed} HTML files and wrote robots.txt')
          PY

      - name: Verify staging safeguards
        working-directory: site
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import xml.etree.ElementTree as ET

          dist = Path('dist')
          base = '/red-river-gorge-hiker-staging/'
          expected_prefix = 'https://ryanredrivergorgehiker.github.io' + base
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'

          html_files = list(dist.rglob('*.html'))
          if not html_files:
              raise RuntimeError('No generated HTML files found')

          class URLParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in {'href', 'src'} and value:
                          self.urls.append((tag, key, value))

          bad_urls = []
          for page in html_files:
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  raise RuntimeError(f'Missing noindex directive in {page}')
              parser = URLParser()
              parser.feed(text)
              for tag, key, value in parser.urls:
                  if value.startswith('/') and not value.startswith('//') and not value.startswith(base):
                      bad_urls.append(f'{page}: <{tag}> {key}={value}')

          if bad_urls:
              raise RuntimeError('Root-relative URLs escaped the staging base:\n' + '\n'.join(bad_urls[:20]))

          robots_lines = (dist / 'robots.txt').read_text(encoding='utf-8').splitlines()
          if robots_lines != ['User-agent: *', 'Disallow: /']:
              raise RuntimeError(f'Unexpected robots.txt content: {robots_lines!r}')

          sitemap_files = list(dist.glob('sitemap*.xml'))
          if not sitemap_files:
              raise RuntimeError('No sitemap files found')

          locs = []
          for sitemap in sitemap_files:
              root = ET.parse(sitemap).getroot()
              for elem in root.iter():
                  if elem.tag.endswith('loc') and elem.text:
                      locs.append((sitemap, elem.text.strip()))
          if not locs:
              raise RuntimeError('No sitemap <loc> entries found')
          bad_locs = [f'{path}: {loc}' for path, loc in locs if not loc.startswith(expected_prefix)]
          if bad_locs:
              raise RuntimeError('Sitemap URLs do not use the staging URL/base:\n' + '\n'.join(bad_locs[:20]))

          print(f'Verified {len(html_files)} HTML files, robots.txt, internal base URLs, and {len(locs)} sitemap locations')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy staging Pages site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5
