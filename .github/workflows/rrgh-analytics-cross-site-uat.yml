name: RRGH analytics cross-site browser UAT

on:
  push:
    branches:
      - main
    paths:
      - .uat-source-ref
      - tools/rrgh-analytics-cross-site-uat.js
      - .github/workflows/rrgh-analytics-cross-site-uat.yml

permissions:
  contents: read

concurrency:
  group: rrgh-analytics-cross-site-uat
  cancel-in-progress: true

jobs:
  cross-site-uat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout staging control
        uses: actions/checkout@v6

      - name: Resolve exact website source
        id: source
        shell: bash
        run: |
          source_ref="$(head -n 1 .uat-source-ref | tr -d '\r\n')"
          if [ -z "$source_ref" ]; then
            echo "Missing .uat-source-ref" >&2
            exit 1
          fi
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"
          echo "Testing exact website source: $source_ref"

      - name: Checkout exact website source
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: ${{ steps.source.outputs.source_ref }}
          path: site

      - name: Seed validated Skybridge elevation cache
        working-directory: site
        shell: bash
        run: |
          route_json_blob="$(git rev-parse HEAD:src/data/routes/skybridge-arch.json)"
          route_geo_blob="$(git rev-parse HEAD:public/data/routes/skybridge-arch-v1.geojson)"
          route_gpx_blob="$(git rev-parse HEAD:public/downloads/routes/Skybridge_Arch_APPROVED_v1.gpx)"

          if [ "$route_json_blob" != "e266e780e578edf2d2f93134f01a571e08057f59" ] \
            || [ "$route_geo_blob" != "7845938e72579cde013178f9eaceb7dba9fb8234" ] \
            || [ "$route_gpx_blob" != "0e9575f0d5567f70ccc1701ab72c40992afc4628" ]; then
            echo "Route inputs changed; refusing to reuse cached elevation data." >&2
            exit 1
          fi

          mkdir -p public/data/routes
          cp .ci-cache/skybridge-arch.elevation.json public/data/routes/skybridge-arch.elevation.json
          echo "Seeded validated Skybridge elevation artifact for unchanged route inputs."

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        working-directory: site
        run: npm ci

      - name: Build exact source production-equivalently
        working-directory: site
        env:
          SITE_URL: https://redrivergorgehiker.com
          BASE_PATH: /
        run: |
          npm run validate
          npm run validate:routes
          npx astro check
          npm test
          npm run build:site

      - name: Install Chromium UAT runner
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 http-server@14.1.1
          npx playwright install --with-deps chromium

      - name: Create temporary HTTPS certificate
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout rrgh-uat-key.pem \
            -out rrgh-uat-cert.pem \
            -days 1 \
            -subj "/CN=redrivergorgehiker.com" \
            -addext "subjectAltName=DNS:redrivergorgehiker.com"

      - name: Serve production-equivalent build under production hostname
        shell: bash
        run: |
          npx http-server site/dist -S -C rrgh-uat-cert.pem -K rrgh-uat-key.pem -p 8443 -a 0.0.0.0 > rrgh-uat-server.log 2>&1 &
          echo $! > rrgh-uat-server.pid
          for i in {1..30}; do
            if curl -kfsS --resolve redrivergorgehiker.com:8443:127.0.0.1 https://redrivergorgehiker.com:8443/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat rrgh-uat-server.log
          exit 1

      - name: Run real-browser main↔Store UAT
        run: node tools/rrgh-analytics-cross-site-uat.js

      - name: Upload UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rrgh-analytics-cross-site-uat-${{ steps.source.outputs.source_ref }}
          path: |
            uat-evidence/
            rrgh-uat-server.log
          if-no-files-found: warn
          retention-days: 30
