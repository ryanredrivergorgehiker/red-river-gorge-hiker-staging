name: Double Rainbow greeting card UAT

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/uat-double-rainbow-greeting-card.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build greeting card UAT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact website candidate
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: 70e0623d9a504d4e642d18d0f60bf2ab32babae9
          path: site

      - name: Reconstruct optimized greeting-card asset
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/merchandise
          cat .tmp-double-rainbow/avif-01.b64 .tmp-double-rainbow/avif-02.b64 \
            | base64 --decode \
            > public/assets/merchandise/rrgh-merch-double-rainbow-greeting-card-3d945e8a.avif
          echo '3d945e8a236e7106735fa558e2ff4c7eea74b5e39f29c2364209e43b31bd2b00  public/assets/merchandise/rrgh-merch-double-rainbow-greeting-card-3d945e8a.avif' | sha256sum --check

      - name: Generate matching social-preview JPEG
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'Pillow>=11.3,<12'
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('public/assets/merchandise')
          avif = root / 'rrgh-merch-double-rainbow-greeting-card-3d945e8a.avif'
          share = root / 'rrgh-merch-double-rainbow-greeting-card-3d945e8a-share.jpg'
          with Image.open(avif) as image:
              if image.size != (1000, 750):
                  raise RuntimeError(f'Unexpected AVIF dimensions: {image.size}')
              image.convert('RGB').save(share, 'JPEG', quality=82, optimize=True, progressive=True)
          with Image.open(share) as image:
              if image.size != (1000, 750):
                  raise RuntimeError(f'Unexpected JPEG dimensions: {image.size}')
          if avif.stat().st_size >= 200_000 or share.stat().st_size >= 250_000:
              raise RuntimeError('Optimized greeting-card derivative exceeds expected size ceiling')
          print(f'AVIF {avif.stat().st_size} bytes; share JPEG {share.stat().st_size} bytes')
          PY

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Audit dependencies
        working-directory: site
        run: |
          npm audit --audit-level=critical
          npm audit --omit=dev --audit-level=high

      - name: Run full website checks
        working-directory: site
        run: npm run check

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Mark staging output noindex
        working-directory: site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          changed = 0
          for page in dist.rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  if '<head>' in text:
                      text = text.replace('<head>', f'<head>{robots_meta}', 1)
                  else:
                      text = robots_meta + text
                  page.write_text(text, encoding='utf-8')
                  changed += 1
          (dist / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          if changed == 0:
              raise RuntimeError('No HTML pages received the staging noindex directive')
          print(f'Injected noindex into {changed} HTML files')
          PY

      - name: Validate staging safeguards and 21-card contract
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET

          dist = Path('dist')
          base = '/red-river-gorge-hiker-staging/'
          expected_prefix = 'https://ryanredrivergorgehiker.github.io' + base
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          expected = [
              'double-rainbow-eagles-point-buttress-greeting-card',
              'tshirt-chest-logo', 'sticker', 'tote-bag', 'tshirt-regular-fit',
              'coffee-mug', 'womens-tshirt', 'sweatshirt', 'tshirt-pocket-logo',
              'throw-pillow', 'womens-tank-top', 'zip-pouch', 'fleece-sherpa-blanket',
              'youth-tshirt', 'spiral-notebook', 'bath-towel', 'beach-towel',
              'kids-tshirt', 'greeting-cards', 'baby-one-piece', 'ornament',
          ]

          html_files = list(dist.rglob('*.html'))
          if not html_files:
              raise RuntimeError('No generated HTML files found')
          for page in html_files:
              if robots_meta not in page.read_text(encoding='utf-8'):
                  raise RuntimeError(f'Missing staging noindex: {page}')
          if (dist / 'robots.txt').read_text(encoding='utf-8').splitlines() != ['User-agent: *', 'Disallow: /']:
              raise RuntimeError('Unexpected staging robots.txt')

          gear = (dist / 'gear/index.html').read_text(encoding='utf-8')
          actual = re.findall(r'data-product="([^"]+)"', gear)
          if actual != expected or len(actual) != 21:
              raise RuntimeError(f'Gear order/count mismatch: {actual}')

          title = 'Double Rainbow at Eagle’s Point Buttress Greeting Card'
          if title not in gear or 'From $6.25' not in gear:
              raise RuntimeError('New #1 Gear card title or landing price missing')

          detail_path = dist / 'gear/double-rainbow-eagles-point-buttress-greeting-card/index.html'
          detail = detail_path.read_text(encoding='utf-8')
          required = [
              title,
              'Single Card — $6.25',
              'Pack of 10 — $35.00 total ($3.50 per card)',
              'Pack of 25 — $53.00 total (FAA displays $2.12 per card)',
              'Fine Art America allows the buyer to enter an optional inside message.',
              'https://fineartamerica.com/featured/2-double-rainbow-at-eagles-point-buttress-ryan-d-lewis.html?product=greeting-card',
              'View on Fine Art America',
              'Share ↗',
              'quantity selection, optional inside-message customization, checkout, payment, production, fulfillment, and shipping',
              'rrgh-merch-double-rainbow-greeting-card-3d945e8a-share.jpg',
          ]
          for token in required:
              if token not in detail:
                  raise RuntimeError(f'Missing greeting-card detail token: {token}')
          if '#2 Double Rainbow' in detail:
              raise RuntimeError('FAA listing number leaked into website title')

          avif_name = 'rrgh-merch-double-rainbow-greeting-card-3d945e8a.avif'
          jpg_name = 'rrgh-merch-double-rainbow-greeting-card-3d945e8a-share.jpg'
          for name in (avif_name, jpg_name):
              if not (dist / 'assets/merchandise' / name).exists():
                  raise RuntimeError(f'Missing built greeting-card asset: {name}')
          if avif_name not in gear or avif_name not in detail:
              raise RuntimeError('Greeting-card AVIF is not active on landing and detail pages')

          # Every prescribed Gear detail link exists and every landing Gear image resolves.
          for slug in expected:
              if not (dist / 'gear' / slug / 'index.html').exists():
                  raise RuntimeError(f'Missing Gear detail page: {slug}')
          image_refs = set(re.findall(r'(?:src|data-image-src)="([^"]*assets/merchandise/[^"]+)"', gear))
          if len(image_refs) < 21:
              raise RuntimeError(f'Expected 21 Gear image references, got {len(image_refs)}')
          for ref in image_refs:
              path = urlparse(ref).path
              filename = path.split('/assets/merchandise/', 1)[1]
              if not (dist / 'assets/merchandise' / filename).exists():
                  raise RuntimeError(f'Broken Gear image reference: {ref}')

          class URLParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in {'href', 'src'} and value:
                          self.urls.append(value)

          bad_root_urls = []
          for page in html_files:
              parser = URLParser()
              parser.feed(page.read_text(encoding='utf-8'))
              for value in parser.urls:
                  if value.startswith('/') and not value.startswith('//') and not value.startswith(base):
                      bad_root_urls.append(f'{page}: {value}')
          if bad_root_urls:
              raise RuntimeError('URLs escaped staging base:\n' + '\n'.join(bad_root_urls[:20]))

          sitemap_files = list(dist.glob('sitemap*.xml'))
          locs = []
          for sitemap in sitemap_files:
              root = ET.parse(sitemap).getroot()
              for elem in root.iter():
                  if elem.tag.endswith('loc') and elem.text:
                      locs.append(elem.text.strip())
          if not locs or any(not loc.startswith(expected_prefix) for loc in locs):
              raise RuntimeError('Staging sitemap contains invalid URL(s)')

          print('UAT validation passed: exactly 21 Gear cards, prescribed order, detail copy, assets, routes, staging URLs, sitemap, noindex, and robots safeguards.')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy greeting card UAT to staging Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5
