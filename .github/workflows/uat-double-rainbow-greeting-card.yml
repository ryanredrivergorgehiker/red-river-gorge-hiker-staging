name: Double Rainbow greeting card UAT

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/uat-double-rainbow-greeting-card.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: staging-pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build greeting card UAT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact website candidate
        uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: 8f620c69e24373699325a156b0ceed3ae8d3ea07
          path: site

      - name: Reconstruct exact optimized greeting-card assets
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/merchandise
          cat \
            .tmp-double-rainbow/avif-01.b64 \
            .tmp-double-rainbow/avif-gap-15000-15999.b64 \
            .tmp-double-rainbow/avif-16000-31999.b64 \
            .tmp-double-rainbow/avif-gap-32000-34532.b64 \
            .tmp-double-rainbow/avif-02.b64 \
            | base64 --decode \
            > public/assets/merchandise/rrgh-merch-double-rainbow-greeting-card-3d945e8a.avif
          echo '3d945e8a236e7106735fa558e2ff4c7eea74b5e39f29c2364209e43b31bd2b00  public/assets/merchandise/rrgh-merch-double-rainbow-greeting-card-3d945e8a.avif' | sha256sum --check
          python3 -m pip install --disable-pip-version-check 'Pillow>=11.3,<12'
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path('public/assets/merchandise')
          avif = root / 'rrgh-merch-double-rainbow-greeting-card-3d945e8a.avif'
          share = root / 'rrgh-merch-double-rainbow-greeting-card-3d945e8a-share.jpg'
          with Image.open(avif) as image:
              if image.size != (1000, 750):
                  raise SystemExit(f'Unexpected AVIF dimensions: {image.size}')
              image.convert('RGB').save(share, 'JPEG', quality=82, optimize=True, progressive=True)
          with Image.open(share) as image:
              if image.size != (1000, 750):
                  raise SystemExit(f'Unexpected JPEG dimensions: {image.size}')
          if avif.stat().st_size >= 200_000 or share.stat().st_size >= 250_000:
              raise SystemExit('Optimized asset size guard failed')
          PY
          echo '2710c25065a58b76b1bae6425ccd3baa3fe80e6be0f3ca8e6d71e24e339f544b  public/assets/merchandise/rrgh-merch-double-rainbow-greeting-card-3d945e8a-share.jpg' | sha256sum --check

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install and validate source candidate
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 tests/test_double_rainbow_greeting_card_contract.py
          npm audit --audit-level=critical
          npm audit --omit=dev --audit-level=high
          npm run check
          git diff --check

      - name: Build staging site
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build

      - name: Mark staging output noindex
        working-directory: site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dist = Path('dist')
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          changed = 0
          for page in dist.rglob('*.html'):
              text = page.read_text(encoding='utf-8')
              if robots_meta not in text:
                  text = text.replace('<head>', f'<head>{robots_meta}', 1) if '<head>' in text else robots_meta + text
                  page.write_text(text, encoding='utf-8')
                  changed += 1
          (dist / 'robots.txt').write_text('User-agent: *\nDisallow: /\n', encoding='utf-8')
          if changed == 0:
              raise RuntimeError('No HTML files received staging noindex')
          PY

      - name: Validate 21-card order, detail, assets, and staging safeguards
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import xml.etree.ElementTree as ET

          dist = Path('dist')
          base = '/red-river-gorge-hiker-staging/'
          expected_prefix = 'https://ryanredrivergorgehiker.github.io' + base
          robots_meta = '<meta name="robots" content="noindex,nofollow,noarchive">'
          expected = [
              'double-rainbow-eagles-point-buttress-greeting-card',
              'tshirt-chest-logo', 'sticker', 'tote-bag', 'tshirt-regular-fit',
              'coffee-mug', 'womens-tshirt', 'sweatshirt', 'tshirt-pocket-logo',
              'throw-pillow', 'womens-tank-top', 'zip-pouch', 'fleece-sherpa-blanket',
              'youth-tshirt', 'spiral-notebook', 'bath-towel', 'beach-towel',
              'kids-tshirt', 'greeting-cards', 'baby-one-piece', 'ornament'
          ]
          html_files = list(dist.rglob('*.html'))
          if not html_files:
              raise RuntimeError('No generated HTML')
          for page in html_files:
              if robots_meta not in page.read_text(encoding='utf-8'):
                  raise RuntimeError(f'Missing noindex: {page}')
          if (dist / 'robots.txt').read_text(encoding='utf-8').splitlines() != ['User-agent: *', 'Disallow: /']:
              raise RuntimeError('Bad staging robots.txt')

          gear = (dist / 'gear/index.html').read_text(encoding='utf-8')
          actual = re.findall(r'data-product="([^"]+)"', gear)
          if actual != expected or len(actual) != 21:
              raise RuntimeError(f'Gear order/count mismatch: {actual}')
          title = 'Double Rainbow at Eagle’s Point Buttress Greeting Card'
          if title not in gear or 'From $6.25' not in gear:
              raise RuntimeError('New Gear card missing title or price')

          detail_path = dist / 'gear/double-rainbow-eagles-point-buttress-greeting-card/index.html'
          if not detail_path.exists():
              raise RuntimeError('Greeting card detail page missing')
          detail = detail_path.read_text(encoding='utf-8')
          for token in [
              title,
              'Single Card — $6.25',
              'Pack of 10 — $35.00 total ($3.50 per card)',
              'Pack of 25 — $53.00 total (FAA displays $2.12 per card)',
              'Fine Art America allows the buyer to enter an optional inside message.',
              'https://fineartamerica.com/featured/2-double-rainbow-at-eagles-point-buttress-ryan-d-lewis.html?product=greeting-card',
              'View on Fine Art America',
              'quantity selection, optional inside-message customization, checkout, payment, production, fulfillment, and shipping',
              'rrgh-merch-double-rainbow-greeting-card-3d945e8a-share.jpg'
          ]:
              if token not in detail:
                  raise RuntimeError(f'Missing detail content: {token}')
          if '#2 Double Rainbow' in detail:
              raise RuntimeError('FAA listing number leaked into customer-facing title')

          for name in [
              'rrgh-merch-double-rainbow-greeting-card-3d945e8a.avif',
              'rrgh-merch-double-rainbow-greeting-card-3d945e8a-share.jpg'
          ]:
              if not (dist / 'assets/merchandise' / name).exists():
                  raise RuntimeError(f'Missing built asset: {name}')
          for slug in expected:
              if not (dist / 'gear' / slug / 'index.html').exists():
                  raise RuntimeError(f'Missing Gear detail route: {slug}')

          image_refs = set(re.findall(r'(?:src|data-image-src)="([^"]*assets/merchandise/[^"]+)"', gear))
          if len(image_refs) < 21:
              raise RuntimeError(f'Expected >=21 Gear image refs; got {len(image_refs)}')
          for ref in image_refs:
              filename = urlparse(ref).path.split('/assets/merchandise/', 1)[1]
              if not (dist / 'assets/merchandise' / filename).exists():
                  raise RuntimeError(f'Broken Gear image ref: {ref}')

          class URLParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in {'href', 'src'} and value:
                          self.urls.append(value)
          bad = []
          for page in html_files:
              parser = URLParser(); parser.feed(page.read_text(encoding='utf-8'))
              bad.extend(f'{page}: {u}' for u in parser.urls if u.startswith('/') and not u.startswith('//') and not u.startswith(base))
          if bad:
              raise RuntimeError('Root-relative URL escaped staging base:\n' + '\n'.join(bad[:20]))

          locs = []
          for sitemap in dist.glob('sitemap*.xml'):
              for elem in ET.parse(sitemap).getroot().iter():
                  if elem.tag.endswith('loc') and elem.text:
                      locs.append(elem.text.strip())
          if not locs or any(not loc.startswith(expected_prefix) for loc in locs):
              raise RuntimeError('Bad staging sitemap URL')
          print('PASS: 21 Gear cards in prescribed order; greeting-card detail, routes, assets, noindex, robots and sitemap safeguards verified.')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload staging artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    name: Deploy greeting card UAT to staging Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy staging site
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Checkout staging control repo
        uses: actions/checkout@v6

      - name: Record successful UAT run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .uat
          cat > .uat/double-rainbow-greeting-card-status.txt <<EOF
          status=PASSED
          run_id=${{ github.run_id }}
          workflow_sha=${{ github.sha }}
          source_sha=8f620c69e24373699325a156b0ceed3ae8d3ea07
          avif_sha256=3d945e8a236e7106735fa558e2ff4c7eea74b5e39f29c2364209e43b31bd2b00
          share_jpeg_sha256=2710c25065a58b76b1bae6425ccd3baa3fe80e6be0f3ca8e6d71e24e339f544b
          staging_url=https://ryanredrivergorgehiker.github.io/red-river-gorge-hiker-staging/
          gear_url=https://ryanredrivergorgehiker.github.io/red-river-gorge-hiker-staging/gear/
          detail_url=https://ryanredrivergorgehiker.github.io/red-river-gorge-hiker-staging/gear/double-rainbow-eagles-point-buttress-greeting-card/
          EOF
          git config user.name 'ryanredrivergorgehiker'
          git config user.email 'ryan@redrivergorgehiker.com'
          git add .uat/double-rainbow-greeting-card-status.txt
          git commit -m 'Record successful Double Rainbow greeting card UAT'
          git push origin HEAD:main
