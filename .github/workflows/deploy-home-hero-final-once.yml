name: Deploy homepage hero final once
on:
  push:
    paths:
      - '.github/workflows/deploy-home-hero-final-once.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ryanredrivergorgehiker/red-river-gorge-hiker
          ref: e7ba9bd41ba1771138245938d2de00366ff7a08f
          path: site
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - working-directory: site
        run: npm ci
      - working-directory: site
        run: npm run check
      - name: Verify hero contract
        working-directory: site
        run: |
          grep -q 'padding-top: 0 !important' src/styles/home-brand.css
          grep -q 'align-items: end !important' src/styles/home-brand.css
          ! grep -q 'red-byrd' src/styles/home-brand.css
          grep -q 'background-size: cover' src/styles/sar-polish.css
          grep -q 'background-position: center 45%' src/styles/sar-polish.css
      - name: Build
        working-directory: site
        env:
          SITE_URL: https://ryanredrivergorgehiker.github.io
          BASE_PATH: /red-river-gorge-hiker-staging/
        run: npm run build
      - name: Stage safeguards
        working-directory: site
        run: |
          python - <<'PY'
          from pathlib import Path
          for page in Path('dist').rglob('*.html'):
              s=page.read_text()
              marker='<meta name="robots" content="noindex,nofollow,noarchive">'
              if marker not in s:
                  s=s.replace('<head>', '<head>'+marker, 1)
                  page.write_text(s)
          Path('dist/robots.txt').write_text('User-agent: *\nDisallow: /\n')
          PY
          grep -q 'noindex,nofollow,noarchive' dist/index.html
          test "$(cat dist/robots.txt)" = $'User-agent: *\nDisallow: /'
          grep -q 'RRGH-0001-double-rainbow' dist/index.html
          grep -q 'RRGH-0001-double-rainbow' dist/search-and-rescue/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
